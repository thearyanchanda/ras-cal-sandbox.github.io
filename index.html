<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ras</title>
    <!-- Switched from a third-party CDN to a secure, same-origin local asset path -->
    <script src="gsap.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Apple Garamond", "EB Garamond", "Garamond", "Baskerville", serif;
            background-color: #fcfcfc; color: #111111;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 40px 20px; -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 680px; width: 100%; background: #ffffff;
            border: 1px solid #e1e1e1; padding: 60px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02); opacity: 1;
        }
        header { margin-bottom: 40px; border-bottom: 1px solid #111111; padding-bottom: 25px; text-align: center; position: relative; }
        h1 { font-size: 2.5rem; font-weight: 400; margin-bottom: 15px; }
        .nav-bar { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 1.15rem; }
        .main-loader {
            display: flex; align-items: center; justify-content: center;
            min-height: 320px; font-style: italic; font-size: 2rem; color: #666666;
            letter-spacing: 0.5px;
        }
        .main-loader .dots { display: inline-block; width: 1em; text-align: left; }
        #fieldsWrapper { display: none; }
        #currentDateLabel { font-style: italic; cursor: pointer; padding: 2px 8px; border-bottom: 1px dotted #111111; }
        #currentDateLabel:hover { color: #555555; border-bottom-color: #555555; }
        .nav-btn {
            background: none; border: 1px solid #e1e1e1; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-family: inherit; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .nav-btn:hover { border-color: #111; background: #f9f9f9; }
        .calendar-popover {
            display: none; position: absolute; top: 105%; left: 50%; transform: translateX(-50%);
            background: #ffffff; border: 1px solid #111111; padding: 20px; width: 280px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); z-index: 10; opacity: 0;
        }
        .calendar-popover .cal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 15px; font-size: 1rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .weekday-label { font-size: 0.75rem; font-weight: 600; color: #888888; margin-bottom: 5px; }
        .cal-day { font-size: 0.9rem; padding: 6px 0; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
        .cal-day:hover { border-color: #111111; background: #f9f9f9; }
        .cal-day.empty { cursor: default; }
        .cal-day.empty:hover { border-color: transparent; background: none; }
        .cal-day.has-entry { font-weight: 600; text-decoration: underline; }
        .cal-day.active { background: #111111; color: #ffffff; }
        .entry-group { margin-bottom: 30px; }
        label { display: block; font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        textarea {
            width: 100%; height: 95px; font-family: inherit; font-size: 1.1rem; line-height: 1.4;
            padding: 12px; background-color: #fafafa; border: 1px solid #dcdcdc; color: #222222;
            resize: vertical; outline: none; transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        textarea:focus { border-color: #111111; background-color: #ffffff; }

        /* Fourth & Broadway toggle */
        .toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
        }
        .toggle-label {
            font-size: 1.2rem; font-weight: 600; margin-bottom: 0; flex: 1; min-width: 200px;
        }
        .toggle-switch {
            position: relative; display: inline-flex; width: 130px; height: 38px;
            cursor: pointer; user-select: none; flex-shrink: 0;
            background: #f0f0f0;
        }
        .toggle-highlight {
            position: absolute; top: 0; left: 0; width: 50%; height: 100%;
            background: #111111; transition: transform 0.3s ease; z-index: 1;
        }
        .toggle-option {
            position: relative; z-index: 2; flex: 1; display: flex; align-items: center;
            justify-content: center; font-family: inherit; font-size: 1rem; color: #111111;
            transition: color 0.3s ease;
        }
        .fab-textarea-wrap { overflow: hidden; height: 0; opacity: 0; }
        #cat5 { margin-top: 14px; }

        .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 35px; }
        button.primary-btn { background-color: #111111; color: #ffffff; border: none; font-family: inherit; font-size: 1.1rem; padding: 10px 30px; cursor: pointer; transition: background-color 0.2s ease; }
        button.primary-btn:hover { background-color: #333333; }
        button:disabled { background-color: #aaaaaa; cursor: not-allowed; }
        #status { font-size: 1rem; font-style: italic; color: #666666; }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>What did you do today?</h1>
            <div class="nav-bar">
                <button class="nav-btn" onclick="changeDay(-1)">&#8592;</button>
                <span id="currentDateLabel" onclick="toggleCalendar()">Loading Date...</span>
                <button class="nav-btn" onclick="changeDay(1)">&#8594;</button>
            </div>
            <div class="calendar-popover" id="calendarPopover">
                <div class="cal-header">
                    <button class="nav-btn" onclick="changeMonth(-1); event.stopPropagation();">&#8592;</button>
                    <span id="calMonthLabel">Month Year</span>
                    <button class="nav-btn" onclick="changeMonth(1); event.stopPropagation();">&#8594;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </header>

        <main>
            <div class="main-loader" id="mainLoader">loading<span class="dots" id="loadingDots"></span></div>
            <div id="fieldsWrapper">
            <div class="entry-group">
                <label for="cat1">exercise</label>
                <textarea id="cat1" placeholder="What you exercised, personal bests, how it's feeling..."></textarea>
            </div>
            <div class="entry-group">
                <label for="cat2">nutrition</label>
                <textarea id="cat2" placeholder="Reflecting on meals, snacks, healthy choices..."></textarea>
            </div>
            <div class="entry-group">
                <label for="cat3">make art</label>
                <textarea id="cat3" placeholder="Songs analyzed, beats made, songs written, projects mixed/mastered..."></textarea>
            </div>
            <div class="entry-group">
                <label for="cat4">take care of business</label>
                <textarea id="cat4" placeholder="ras-cal social media, editing, submissions, planning, organizing...."></textarea>
            </div>
            <div class="entry-group">
                <div class="toggle-row">
                    <label class="toggle-label">did you work on fourth and broadway?</label>
                    <div class="toggle-switch" id="fabToggle" onclick="toggleFab()">
                        <div class="toggle-highlight" id="fabHighlight"></div>
                        <span class="toggle-option" id="fabNo">No</span>
                        <span class="toggle-option" id="fabYes">Yes</span>
                    </div>
                </div>
                <div class="fab-textarea-wrap" id="cat5Wrap">
                    <textarea id="cat5" placeholder="Closed sales, content posted, client meetings..."></textarea>
                </div>
            </div>
            <div class="entry-group">
                <label for="cat6">the wind-down</label>
                <textarea id="cat6" placeholder="Listening to music, skincare, cold shower, reading...."></textarea>
            </div>
            <div class="footer-actions">
                <div id="status"></div>
                <button id="submitBtn" class="primary-btn" onclick="saveData()">Save Entry</button>
            </div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXGmCkiGNy_5lqwp8s_zWxTr9b50XvcPzgq9erkwo1beJtUNpxVlZQjeTjMos1nksgSQ/exec";
        let allEntries = [], viewingDate = new Date(), calendarMonthView = new Date();
        let fabState = false; // false = "No" (cat5 hidden/blank), true = "Yes" (cat5 shown)
        let dotInterval;

        // Optimized Launch Sequence: Paint the canvas instantly
        window.addEventListener("DOMContentLoaded", () => {
            if (typeof gsap !== "undefined") {
                gsap.fromTo(".container", { opacity: 0, y: 15 }, { duration: 0.8, opacity: 1, y: 0, ease: "power2.out" });
            } else {
                document.querySelector(".container").style.opacity = "1";
            }

            // Animated "loading..." dots that build up and reset, large and centered
            // in the fields area, while the date nav/calendar stay fully usable.
            const dotsLabel = document.getElementById("loadingDots");
            let dotCount = 0;
            dotInterval = setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                dotsLabel.innerText = ".".repeat(dotCount);
            }, 350);

            updateFabUI(false);

            // Prime local textareas immediately before requesting remote data
            renderCurrentView(true);

            // Dispatch cloud sync to a non-blocking background network thread
            fetchEntriesInBackground();
        });

        // Swaps the fields-area loader out for the actual entry fields, fading them in
        function revealContent() {
            clearInterval(dotInterval);
            const loader = document.getElementById("mainLoader");
            const fields = document.getElementById("fieldsWrapper");

            if (typeof gsap === "undefined") {
                loader.style.display = "none";
                fields.style.display = "block";
                return;
            }

            fields.style.display = "block";
            gsap.killTweensOf(loader);
            gsap.killTweensOf(fields);

            const tl = gsap.timeline();
            tl.to(loader, { opacity: 0, duration: 0.25, ease: "power1.in", onComplete: () => loader.style.display = "none" });
            tl.fromTo(fields, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, "-=0.15");
        }

        // Quietly pulls past logs without blocking user input
        async function fetchEntriesInBackground() {
            const status = document.getElementById("status");

            try {
                const res = await fetch(SCRIPT_URL);
                allEntries = await res.json();

                // Merge data seamlessly once the stream finishes loading
                renderCurrentView(false);
            } catch (err) {
                console.warn("Background log sync delayed.", err);
                status.innerText = "Offline workspace mode active.";
            } finally {
                revealContent();
            }
        }

        function renderCurrentView(isInitialInstantPaint = false) {
            document.getElementById("currentDateLabel").innerText = viewingDate.toLocaleDateString('en-US', {
                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
            });

            const match = allEntries.find(e => formatKeyMatch(e.date, viewingDate));
            const status = document.getElementById("status");

            if (match) {
                document.getElementById("cat1").value = match.cat1 || "";
                document.getElementById("cat2").value = match.cat2 || "";
                document.getElementById("cat3").value = match.cat3 || "";
                document.getElementById("cat4").value = match.cat4 || "";
                document.getElementById("cat5").value = match.cat5 || "";
                document.getElementById("cat6").value = match.cat6 || "";
                fabState = !!(match.cat5 && String(match.cat5).trim() !== "");
                status.innerText = "Viewing archived log.";
            } else {
                document.getElementById("cat1").value = "";
                document.getElementById("cat2").value = "";
                document.getElementById("cat3").value = "";
                document.getElementById("cat4").value = "";
                document.getElementById("cat5").value = "";
                document.getElementById("cat6").value = "";
                fabState = false;

                if (isInitialInstantPaint) {
                    status.innerText = "Ready.";
                } else {
                    status.innerText = "New clean canvas entry.";
                }
            }

            updateFabUI(!isInitialInstantPaint);

            // Only run animations on active page turns, not background refreshes
            if (!isInitialInstantPaint && typeof gsap !== "undefined") {
                gsap.fromTo("textarea", { opacity: 0.6 }, { opacity: 1, duration: 0.3 });
            }
            renderGridCalendar();
        }

        function toggleFab(forceState) {
            fabState = (typeof forceState === "boolean") ? forceState : !fabState;
            updateFabUI(true);
        }

        // animate: whether to smoothly slide/fade the textarea open or closed
        // (false is used for the very first instant paint, so nothing jumps around on load)
        function updateFabUI(animate = true) {
            const highlight = document.getElementById("fabHighlight");
            const noEl = document.getElementById("fabNo");
            const yesEl = document.getElementById("fabYes");

            if (fabState) {
                highlight.style.transform = "translateX(100%)";
                yesEl.style.color = "#ffffff";
                noEl.style.color = "#111111";
            } else {
                highlight.style.transform = "translateX(0)";
                noEl.style.color = "#ffffff";
                yesEl.style.color = "#111111";
            }

            setFabTextareaVisibility(fabState, animate);
        }

        function setFabTextareaVisibility(show, animate) {
            const wrap = document.getElementById("cat5Wrap");
            const cat5 = document.getElementById("cat5");

            // No-animation path: used on the very first instant paint
            if (!animate || typeof gsap === "undefined") {
                if (show) {
                    wrap.style.height = "auto";
                    wrap.style.opacity = "1";
                    cat5.style.transform = "translateY(0)";
                } else {
                    wrap.style.height = "0px";
                    wrap.style.opacity = "0";
                }
                return;
            }

            gsap.killTweensOf(wrap);
            gsap.killTweensOf(cat5);

            if (show) {
                // Measure the natural height, collapse back to 0, then drop it open
                wrap.style.height = "auto";
                const targetHeight = wrap.offsetHeight;
                wrap.style.height = "0px";
                gsap.fromTo(wrap,
                    { height: 0, opacity: 0 },
                    {
                        height: targetHeight, opacity: 1, duration: 0.55, ease: "power3.out",
                        onComplete: () => { wrap.style.height = "auto"; }
                    }
                );
                gsap.fromTo(cat5,
                    { y: -14 },
                    { y: 0, duration: 0.55, ease: "back.out(1.4)" }
                );
            } else {
                const currentHeight = wrap.offsetHeight;
                wrap.style.height = currentHeight + "px";
                gsap.to(wrap, { height: 0, opacity: 0, duration: 0.35, ease: "power2.inOut" });
                gsap.to(cat5, { y: -14, duration: 0.3, ease: "power2.in" });
            }
        }

        function formatKeyMatch(d1, d2) {
            return new Date(d1).toDateString() === new Date(d2).toDateString();
        }

        function changeDay(offset) {
            const newDate = new Date(viewingDate);
            newDate.setDate(newDate.getDate() + offset);
            swapToDate(newDate);
        }

        // Quick fade-out/fade-in "refresh" flash whenever the viewed day changes
        function swapToDate(newDate) {
            const main = document.querySelector("main");

            if (typeof gsap === "undefined") {
                viewingDate = newDate;
                calendarMonthView = new Date(viewingDate);
                renderCurrentView();
                return;
            }

            gsap.killTweensOf(main);
            gsap.to(main, {
                opacity: 0.25, duration: 0.12, ease: "power1.in",
                onComplete: () => {
                    viewingDate = newDate;
                    calendarMonthView = new Date(viewingDate);
                    renderCurrentView();
                    gsap.to(main, { opacity: 1, duration: 0.22, ease: "power1.out" });
                }
            });
        }

        function toggleCalendar() {
            const popover = document.getElementById("calendarPopover");
            if (popover.style.display === "block") {
                if (typeof gsap !== "undefined") {
                    gsap.to(popover, { opacity: 0, y: -10, duration: 0.2, onComplete: () => popover.style.display = "none" });
                } else {
                    popover.style.display = "none";
                }
            } else {
                popover.style.display = "block";
                calendarMonthView = new Date(viewingDate);
                renderGridCalendar();
                if (typeof gsap !== "undefined") {
                    gsap.fromTo(popover, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" });
                } else {
                    popover.style.opacity = "1";
                }
            }
        }

        function changeMonth(offset) {
            calendarMonthView.setMonth(calendarMonthView.getMonth() + offset);
            renderGridCalendar();
        }

        function renderGridCalendar() {
            document.getElementById("calMonthLabel").innerText = calendarMonthView.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            weekdays.forEach(day => {
                const el = document.createElement("div");
                el.className = "weekday-label"; el.innerText = day; grid.appendChild(el);
            });

            const year = calendarMonthView.getFullYear(), month = calendarMonthView.getMonth();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const spacer = document.createElement("div"); spacer.className = "cal-day empty"; grid.appendChild(spacer);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement("div");
                dayCell.className = "cal-day"; dayCell.innerText = day;
                const targetDate = new Date(year, month, day);

                if (formatKeyMatch(targetDate, viewingDate)) dayCell.classList.add("active");
                if (allEntries.some(e => formatKeyMatch(e.date, targetDate))) dayCell.classList.add("has-entry");

                dayCell.onclick = () => { swapToDate(targetDate); toggleCalendar(); };
                grid.appendChild(dayCell);
            }
        }

        document.addEventListener("click", (e) => {
            const popover = document.getElementById("calendarPopover"), label = document.getElementById("currentDateLabel");
            if (popover.style.display === "block" && !popover.contains(e.target) && e.target !== label) toggleCalendar();
        });

        async function saveData() {
            const status = document.getElementById("status"), submitBtn = document.getElementById("submitBtn");
            const cat1 = document.getElementById("cat1").value.trim();
            const cat2 = document.getElementById("cat2").value.trim();
            const cat3 = document.getElementById("cat3").value.trim();
            const cat4 = document.getElementById("cat4").value.trim();
            // If the toggle is "No", the fourth-and-broadway field is wiped on submission
            // regardless of any lingering text in the hidden textarea.
            const cat5 = fabState ? document.getElementById("cat5").value.trim() : "";
            const cat6 = document.getElementById("cat6").value.trim();

            if (!cat1 && !cat2 && !cat3 && !cat4 && !cat5 && !cat6) {
                status.style.color = "#b22222"; status.innerText = "The entry cannot be entirely empty."; return;
            }
            status.style.color = "#666666"; status.innerText = "Recording..."; submitBtn.disabled = true;
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cat1, cat2, cat3, cat4, cat5, cat6, date: viewingDate.toISOString() })
                });
                status.style.color = "#006400"; status.innerText = "Entry logged successfully.";
                fetchEntriesInBackground(); // Silently refresh the storage map
            } catch (error) {
                status.style.color = "#b22222"; status.innerText = "Error transmitting log connection.";
            } finally { submitBtn.disabled = false; }
        }
    </script>
</body>
</html>
